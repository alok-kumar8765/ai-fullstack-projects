<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Signature</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Real-Time Signature Verification</h2>
        <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
            
            <div class="mb-3">
                <label for="user_id" class="form-label">Select User Account:</label>
                <select name="user_id" class="form-select" required>
                    {% for user in users %}
                        <option value="{{ user.id }}">{{ user.name }} ({{ user.email }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Choose Input Method:</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="input_method" id="uploadRadio" checked onclick="toggleInput('upload')">
                    <label class="form-check-label" for="uploadRadio">Upload Image File</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="input_method" id="cameraRadio" onclick="toggleInput('camera')">
                    <label class="form-check-label" for="cameraRadio">Capture via Camera</label>
                </div>
            </div>

            <!-- File Upload Input -->
            <div class="mb-3" id="fileUploadSection">
                <label for="signature" class="form-label">Upload Signature Image:</label>
                <input type="file" class="form-control" name="signature" id="signatureFile">
            </div>

            <!-- Live Camera Section -->
            <div class="mb-3 d-none" id="cameraSection">
                <label class="form-label">Live Camera Capture:</label>
                <div>
                    <video id="video" width="320" height="240" autoplay class="border rounded"></video>
                    <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="captureSnapshot()">Capture</button>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <input type="hidden" name="signature_base64" id="signatureBase64">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Verify Signature</button>
        </form>
        <a href="/" class="btn btn-link mt-3">Back to Home</a>
    </div>

    <script>
        function toggleInput(mode) {
            if (mode === 'upload') {
                document.getElementById('fileUploadSection').classList.remove('d-none');
                document.getElementById('cameraSection').classList.add('d-none');
            } else {
                document.getElementById('fileUploadSection').classList.add('d-none');
                document.getElementById('cameraSection').classList.remove('d-none');
                startCamera();
            }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                })
                .catch(err => console.error("Camera error: ", err));
        }

        function captureSnapshot() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            // Convert to file blob or base64 to send to backend if needed
        }
    </script>
</body>
</html>

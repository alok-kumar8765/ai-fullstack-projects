<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4">Register User & Reference Signature</h2>
        
        <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name:</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email Address:</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            
            <div class="mb-3">
                <label for="signature" class="form-label">Upload Reference Signature (Clear image on white paper):</label>
                <input type="file" class="form-control" name="signature" accept="image/*" required>
            </div>
            
            <button type="submit" class="btn btn-success">Register User</button>
        </form>
        
        <a href="/" class="btn btn-link mt-3">Back to Home</a>
    </div>
</body>
</html>
